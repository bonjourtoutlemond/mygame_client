<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ACE MMORPG Web Client</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="shell">
    <section class="stage" aria-label="game stage">
      <div class="topbar">
        <div>
          <p class="eyebrow">ACE MMORPG</p>
          <h1>Web Client</h1>
        </div>
        <div class="status" id="status">disconnected</div>
      </div>

      <div class="world" aria-label="world view">
        <svg class="map" viewBox="0 0 900 560" role="img" aria-label="stylized game map">
          <defs>
            <linearGradient id="river" x1="0" x2="1" y1="0" y2="1">
              <stop offset="0%" stop-color="#56b6c2"/>
              <stop offset="100%" stop-color="#3a7bd5"/>
            </linearGradient>
            <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
              <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="1"/>
            </pattern>
          </defs>
          <rect width="900" height="560" fill="#23372f"/>
          <rect width="900" height="560" fill="url(#grid)"/>
          <path d="M-20 430 C180 360 210 230 360 260 C520 292 545 130 705 116 C802 108 858 156 930 138 L930 590 L-20 590 Z" fill="#415c3f"/>
          <path d="M-10 140 C125 82 196 117 268 184 C357 266 462 258 553 201 C678 123 780 184 916 75" fill="none" stroke="url(#river)" stroke-width="54" stroke-linecap="round" opacity=".9"/>
          <path d="M-10 140 C125 82 196 117 268 184 C357 266 462 258 553 201 C678 123 780 184 916 75" fill="none" stroke="#c6f4ff" stroke-width="8" stroke-linecap="round" opacity=".4"/>
          <g fill="#d8b56b">
            <rect x="100" y="320" width="94" height="68" rx="8"/>
            <rect x="612" y="314" width="128" height="86" rx="8"/>
            <rect x="404" y="92" width="88" height="68" rx="8"/>
          </g>
          <g fill="#7b4d3a">
            <path d="M108 320 L147 284 L186 320 Z"/>
            <path d="M620 314 L676 270 L732 314 Z"/>
            <path d="M412 92 L448 58 L484 92 Z"/>
          </g>
          <g fill="#27412e">
            <circle cx="238" cy="382" r="30"/>
            <circle cx="282" cy="372" r="24"/>
            <circle cx="782" cy="236" r="34"/>
            <circle cx="824" cy="252" r="26"/>
            <circle cx="536" cy="438" r="35"/>
            <circle cx="580" cy="430" r="24"/>
          </g>
          <g class="avatar" transform="translate(436 310)">
            <circle cx="0" cy="0" r="28" fill="#f2c14e"/>
            <circle cx="0" cy="-38" r="20" fill="#f8d7a3"/>
            <path d="M-30 33 Q0 54 30 33" fill="none" stroke="#111827" stroke-width="8" stroke-linecap="round"/>
          </g>
        </svg>
        <div class="nameplate">
          <span id="playerName">guest</span>
          <strong id="playerLevel">Lv -</strong>
        </div>
      </div>
    </section>

    <aside class="controls" aria-label="client controls">
      <div class="panel connect-panel">
        <div class="field-row">
          <label>
            <span>Shard</span>
            <select id="shard">
              <option value="game1">game1 : 5001</option>
              <option value="game2">game2 : 5002</option>
            </select>
          </label>
          <label>
            <span>Name</span>
            <input id="loginName" maxlength="24" value="alice" autocomplete="off">
          </label>
        </div>
        <div class="button-row">
          <button id="connectBtn" class="primary" type="button">Connect</button>
          <button id="loginBtn" type="button">Login</button>
          <button id="quitBtn" type="button">Quit</button>
        </div>
      </div>

      <div class="panel stats-panel">
        <div>
          <span class="label">EXP</span>
          <strong id="playerExp">0</strong>
        </div>
        <div>
          <span class="label">Server</span>
          <strong id="serverName">-</strong>
        </div>
        <button id="expBtn" type="button">+10 EXP</button>
      </div>

      <div class="panel lists">
        <div class="list-head">
          <strong>Players</strong>
          <button id="playersBtn" type="button">Refresh</button>
        </div>
        <div id="players" class="list"></div>
      </div>

      <div class="panel lists">
        <div class="list-head">
          <strong>Friends</strong>
          <button id="friendsBtn" type="button">Refresh</button>
        </div>
        <div class="inline-form">
          <input id="friendName" placeholder="player name" autocomplete="off">
          <button id="addFriendBtn" type="button">Add</button>
        </div>
        <div id="friends" class="list compact"></div>
      </div>

      <div class="panel chat-panel">
        <div id="log" class="log" aria-live="polite"></div>
        <div class="inline-form">
          <input id="targetName" placeholder="target" autocomplete="off">
          <input id="message" placeholder="message" autocomplete="off">
          <button id="sendBtn" type="button">Send</button>
        </div>
      </div>
    </aside>
  </main>
  <script src="./app.js"></script>
</body>
</html>
